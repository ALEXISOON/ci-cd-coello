name: CD - Deploy to VPS

on:
  push:
    branches: ["coello"]  # tu rama de examen

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el código
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Login a GHCR para poder descargar la imagen
      - name: Login to GHCR (build machine)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: "alexisoon"
          password: ${{ secrets.GHCR_PAT }}

      # 3️⃣ Copiar stack.yml al VPS
      - name: Copy stack to VPS
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "stack.yml"
          target: "/home/${{ secrets.VPS_USER }}/coello/"

      # 4️⃣ Desplegar stack en el VPS
      - name: Deploy stack on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Login en GHCR desde el VPS usando tu PAT
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "alexisoon" --password-stdin
            # Descargar la imagen más reciente
            docker pull ghcr.io/alexisoon/coello:1.0.5
            # Eliminar stack anterior si existe
            docker stack rm coello || true
            sleep 5  # esperar a que Docker limpie los recursos
            # Desplegar el stack con la nueva configuración
            docker stack deploy --with-registry-auth -c /home/${{ secrets.VPS_USER }}/coello/stack.yml coello
            # Verificar que el servicio esté corriendo
            docker service ls
            docker service ps coello_app
