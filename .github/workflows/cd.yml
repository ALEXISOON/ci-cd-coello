name: CD - Deploy to VPS

on:
  push:
    branches: ["coello"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GHCR (build machine)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: "alexisoon"
          password: ${{ secrets.GHCR_PAT }}

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.VPS_USER }}/coello/"

      - name: Deploy stack on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Login en GHCR desde VPS usando tu PAT
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "alexisoon" --password-stdin

            # Asegurarse de que la imagen está disponible
            docker pull ghcr.io/alexisoon/coello:1.0.5

            # Eliminar stack anterior si existe
            docker stack rm coello || true
            sleep 5  # esperar a que Docker limpie los recursos

            # Desplegar el stack con la nueva imagen
            docker stack deploy --with-registry-auth -c /home/${{ secrets.VPS_USER }}/coello/docker-compose.yml coello

            # Verificar estado del servicio
            docker service ls
            docker service ps coello_app
