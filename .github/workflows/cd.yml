name: CD - Deploy to VPS

on:
  push:
    branches: ["coello"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: "alexisoon"
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.VPS_USER }}/coello/"

      - name: Deploy stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            docker login ghcr.io -u "alexisoon" -p "${{ secrets.GITHUB_TOKEN }}"
            docker pull ghcr.io/alexisoon/coello:1.0.5
            docker stack deploy --with-registry-auth -c /home/${{ secrets.VPS_USER }}/coello/docker-compose.yml coello
